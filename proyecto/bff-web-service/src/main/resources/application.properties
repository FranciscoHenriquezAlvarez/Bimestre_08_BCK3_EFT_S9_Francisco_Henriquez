spring.application.name=bff-web-service
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
server.port=8082
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.enabled=${EUREKA_ENABLED:true}

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false

# Respaldo local cuando Config Server no esta disponible.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER:http://localhost:9000}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OAUTH2_JWK_SET_URI:http://localhost:9000/oauth2/jwks}

# Circuitos independientes por servicio; no se repiten comandos monetarios.
spring.cloud.loadbalancer.retry.enabled=false
resilience4j.circuitbreaker.instances.coreWeb.ignore-exceptions[0]=org.springframework.web.client.HttpClientErrorException
resilience4j.circuitbreaker.instances.customerWeb.sliding-window-size=5
resilience4j.circuitbreaker.instances.customerWeb.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.customerWeb.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.customerWeb.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.customerWeb.permitted-number-of-calls-in-half-open-state=2
resilience4j.timelimiter.instances.customerWeb.timeout-duration=5s
resilience4j.circuitbreaker.instances.paymentWeb.sliding-window-size=5
resilience4j.circuitbreaker.instances.paymentWeb.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.paymentWeb.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentWeb.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.paymentWeb.permitted-number-of-calls-in-half-open-state=2
resilience4j.timelimiter.instances.paymentWeb.timeout-duration=5s
