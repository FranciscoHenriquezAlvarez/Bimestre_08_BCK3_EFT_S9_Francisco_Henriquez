spring.application.name=core-banking-service
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
# Respaldo local para ejecutar Core sin Config Server durante desarrollo o tests.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/banco_xyz}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:banco_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:banco_password_local}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
spring.sql.init.mode=always
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.enabled=${EUREKA_ENABLED:true}
bank.interest.savings-rate=0.01
bank.interest.loan-rate=0.02
bank.batch.chunk-size=5
bank.batch.core-pool-size=3
bank.batch.max-pool-size=3
bank.batch.queue-capacity=25
bank.batch.retry-limit=3
bank.batch.backoff-ms=100

server.port=8081

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.consumer.group-id=core-banking-withdrawal-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=cl.duoc.bancoxyz.events
spring.kafka.listener.concurrency=3

# Respaldo local cuando Config Server no esta disponible.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER:http://localhost:9000}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OAUTH2_JWK_SET_URI:http://localhost:9000/oauth2/jwks}
