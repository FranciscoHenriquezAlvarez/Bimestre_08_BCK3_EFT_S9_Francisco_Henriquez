spring.application.name=payment-service
server.port=8085
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
management.endpoints.web.exposure.include=health

spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER:http://localhost:9000}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OAUTH2_JWK_SET_URI:http://localhost:9000/oauth2/jwks}
spring.security.oauth2.client.registration.core-operations.provider=bank-authorization
spring.security.oauth2.client.registration.core-operations.client-id=payment-client
spring.security.oauth2.client.registration.core-operations.client-secret=${OAUTH2_PAYMENT_SECRET:}
spring.security.oauth2.client.registration.core-operations.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.core-operations.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.core-operations.scope=account.operations
spring.security.oauth2.client.provider.bank-authorization.token-uri=${OAUTH2_TOKEN_URI:http://localhost:9000/oauth2/token}

payment.core.base-url=http://core-banking-service
payment.http.connect-timeout-ms=2000
payment.http.read-timeout-ms=5000
spring.cloud.loadbalancer.retry.enabled=false

payment.kafka.withdrawals.enabled=false
payment.kafka.publish-timeout-ms=5000
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.consumer.group-id=core-banking-withdrawal-group
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=none
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=cl.duoc.bancoxyz.events
spring.kafka.consumer.properties.spring.json.value.default.type=cl.duoc.bancoxyz.events.WithdrawalRequestedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.listener.concurrency=3
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.max.block.ms=5000
