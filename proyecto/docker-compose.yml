services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: banco_xyz
      POSTGRES_USER: ${POSTGRES_USER:-banco_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-banco_password_local}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 20

  config-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: config-server
    ports:
      - "8888:8888"
    volumes:
      - ./config-repo:/app/config-repo:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  eureka-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: eureka-server
    ports:
      - "8761:8761"
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  authorization-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: authorization-server
    environment:
      OAUTH2_ISSUER: http://authorization-server:9000
      OAUTH2_WEB_SECRET: ${OAUTH2_WEB_SECRET:-web-secret-local}
      OAUTH2_MOBILE_SECRET: ${OAUTH2_MOBILE_SECRET:-mobile-secret-local}
      OAUTH2_ATM_SECRET: ${OAUTH2_ATM_SECRET:-atm-secret-local}
      OAUTH2_PAYMENT_SECRET: ${OAUTH2_PAYMENT_SECRET:?Defina el secreto OAuth2 interno de Pagos}
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  batch-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: core-banking-service
    entrypoint: ["/usr/local/bin/batch-init.sh"]
    environment:
      OAUTH2_ISSUER: http://authorization-server:9000
      OAUTH2_JWK_SET_URI: http://authorization-server:9000/oauth2/jwks
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/banco_xyz
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-banco_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-banco_password_local}
    depends_on:
      authorization-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  core-banking-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: core-banking-service
    environment:
      OAUTH2_ISSUER: http://authorization-server:9000
      OAUTH2_JWK_SET_URI: http://authorization-server:9000/oauth2/jwks
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/banco_xyz
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-banco_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-banco_password_local}
      SPRING_BATCH_JOB_ENABLED: "false"
      SPRING_BATCH_JDBC_INITIALIZE_SCHEMA: never
      SPRING_SQL_INIT_MODE: never
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"
    expose:
      - "8081"
    depends_on:
      authorization-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      batch-init:
        condition: service_completed_successfully
      customer-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  bff-web-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: bff-web-service
    environment:
      OAUTH2_ISSUER: http://authorization-server:9000
      OAUTH2_JWK_SET_URI: http://authorization-server:9000/oauth2/jwks
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
    ports:
      - "8082:8082"
    depends_on:
      authorization-server:
        condition: service_healthy
      core-banking-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  bff-mobile-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: bff-mobile-service
    environment:
      OAUTH2_ISSUER: http://authorization-server:9000
      OAUTH2_JWK_SET_URI: http://authorization-server:9000/oauth2/jwks
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
    ports:
      - "8083:8083"
    depends_on:
      authorization-server:
        condition: service_healthy
      core-banking-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  bff-atm-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: bff-atm-service
    environment:
      OAUTH2_ISSUER: http://authorization-server:9000
      OAUTH2_JWK_SET_URI: http://authorization-server:9000/oauth2/jwks
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8084:8084"
    depends_on:
      authorization-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      core-banking-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  payment-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: payment-service
    environment:
      OAUTH2_ISSUER: http://authorization-server:9000
      OAUTH2_JWK_SET_URI: http://authorization-server:9000/oauth2/jwks
      OAUTH2_TOKEN_URI: http://authorization-server:9000/oauth2/token
      OAUTH2_PAYMENT_SECRET: ${OAUTH2_PAYMENT_SECRET:?Defina el secreto OAuth2 interno de Pagos}
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PAYMENT_KAFKA_WITHDRAWALS_ENABLED: "false"
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"
    expose:
      - "8085"
    depends_on:
      authorization-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      core-banking-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  customer-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: customer-service
    environment:
      OAUTH2_ISSUER: http://authorization-server:9000
      OAUTH2_JWK_SET_URI: http://authorization-server:9000/oauth2/jwks
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/banco_xyz
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-banco_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-banco_password_local}
      CUSTOMER_SQL_INIT_MODE: never
    expose:
      - "8086"
    depends_on:
      authorization-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  postgres_data:
  kafka_data:
