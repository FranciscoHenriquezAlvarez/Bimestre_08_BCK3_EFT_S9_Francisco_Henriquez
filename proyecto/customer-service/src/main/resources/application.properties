spring.application.name=customer-service
server.port=8086
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
management.endpoints.web.exposure.include=health

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/banco_xyz}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
# La inicializacion se habilita explicitamente en pruebas aisladas o en un paso autorizado posterior.
spring.sql.init.mode=${CUSTOMER_SQL_INIT_MODE:never}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER:http://localhost:9000}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OAUTH2_JWK_SET_URI:http://localhost:9000/oauth2/jwks}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-numbers-for-enums=true
