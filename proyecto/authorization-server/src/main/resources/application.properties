spring.application.name=authorization-server
server.port=9000
app.oauth2.issuer=${OAUTH2_ISSUER:http://localhost:9000}
app.oauth2.clients.web-secret=${OAUTH2_WEB_SECRET:web-secret-local}
app.oauth2.clients.mobile-secret=${OAUTH2_MOBILE_SECRET:mobile-secret-local}
app.oauth2.clients.atm-secret=${OAUTH2_ATM_SECRET:atm-secret-local}
app.oauth2.clients.payment-secret=${OAUTH2_PAYMENT_SECRET:}
management.endpoints.web.exposure.include=health
