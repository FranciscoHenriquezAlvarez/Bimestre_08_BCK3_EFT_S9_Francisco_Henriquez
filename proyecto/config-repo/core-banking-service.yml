server:
  port: 8081
bank:
  config-origin: "Configuracion cargada desde Spring Cloud Config Server"
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER:http://localhost:9000}
          jwk-set-uri: ${OAUTH2_JWK_SET_URI:http://localhost:9000/oauth2/jwks}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: core-banking-withdrawal-group
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: cl.duoc.bancoxyz.events
    listener:
      concurrency: 3
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/banco_xyz}
    username: ${SPRING_DATASOURCE_USERNAME:banco_user}
    password: ${SPRING_DATASOURCE_PASSWORD:banco_password_local}
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  sql:
    init:
      mode: always
