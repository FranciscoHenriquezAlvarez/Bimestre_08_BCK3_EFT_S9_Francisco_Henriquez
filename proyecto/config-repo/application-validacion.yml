# Estas propiedades permiten comprobar carga central y distribucion real solo en el entorno de prueba.
server:
  tomcat:
    accesslog:
      enabled: true
      directory: /tmp/eft9-access
      prefix: central-${spring.application.name}
      suffix: .log
      file-date-format: ""
      pattern: '%t %a "%r" %s'
management:
  endpoint:
    health:
      show-details: always
eureka:
  client:
    registry-fetch-interval-seconds: 5
  instance:
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 20
spring:
  cloud:
    loadbalancer:
      cache:
        ttl: 5s
